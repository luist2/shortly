<div class="confirm-dialog">
  <!-- Título del diálogo -->
  <h2 mat-dialog-title>
    <mat-icon class="dialog-icon">{{
      data.confirmColor === "warn" ? "warning" : "help_outline"
    }}</mat-icon>
    {{ data.title }}
  </h2>

  <!-- Contenido del mensaje -->
  <mat-dialog-content>
    <p class="dialog-message">{{ data.message }}</p>
  </mat-dialog-content>

  <!-- Botones de acción -->
  <mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()" cdkFocusInitial>
      {{ data.cancelText }}
    </button>
    <button mat-raised-button [color]="data.confirmColor" (click)="onConfirm()">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
