<div class="confirm-dialog">
  <div class="dialog-header">
    <div
      class="icon-wrapper"
      [ngClass]="{
        'warn-icon': data.confirmColor === 'warn',
        'primary-icon': data.confirmColor !== 'warn'
      }"
    >
      <mat-icon>{{
        data.confirmColor === "warn" ? "warning" : "help"
      }}</mat-icon>
    </div>
    <h2 mat-dialog-title>{{ data.title }}</h2>
  </div>

  <mat-dialog-content>
    <p class="dialog-message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onCancel()" cdkFocusInitial>
      {{ data.cancelText }}
    </button>
    <button mat-raised-button [color]="data.confirmColor" (click)="onConfirm()">
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
