<mat-sidenav-container class="sidenav-container">
  <!-- SIDENAV real -->
  <mat-sidenav #drawer mode="over" class="mobile-sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/urls/new" (click)="drawer.close()">
        <mat-icon matListItemIcon>add_link</mat-icon>
        <span matListItemTitle>New URL</span>
      </a>
      <a mat-list-item routerLink="/dashboard" (click)="drawer.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <mat-divider></mat-divider>
      <button mat-list-item (click)="logout()">
        <mat-icon matListItemIcon>logout</mat-icon>
        <span matListItemTitle>Logout</span>
      </button>
    </mat-nav-list>
  </mat-sidenav>

  <!-- TOOLBAR / NAVBAR -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button class="menu-button" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="logo">
        <mat-icon class="logo-icon">link</mat-icon>
        Shortly
      </span>

      <span class="spacer"></span>

      <nav class="nav-links" *ngIf="isAuthenticated()">
        <a mat-button routerLink="/urls/new" routerLinkActive="active">
          <mat-icon>add_link</mat-icon>
          New URL
        </a>
        <a mat-button routerLink="/dashboard" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          Dashboard
        </a>
      </nav>

      <!-- Usuario -->
      <div class="user-section" *ngIf="isAuthenticated()">
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
          <mat-icon>account_circle</mat-icon>
          <span class="user-email">{{ getUserEmail() }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item disabled>
            <mat-icon>email</mat-icon>
            <span>{{ getUserEmail() }}</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
