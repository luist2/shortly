<div class="link-status-container">
  <mat-card class="status-card">
    <mat-card-header>
      <div mat-card-avatar class="status-avatar" [ngClass]="statusClass">
        <mat-icon>{{ icon }}</mat-icon>
      </div>
      <mat-card-title>{{ title }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p class="status-message">{{ message }}</p>

      <div class="meta-block" *ngIf="shortCode">
        <span class="meta-label">Code</span>
        <span class="meta-value">{{ shortCode }}</span>
      </div>
    </mat-card-content>

    <mat-card-actions class="actions">
      <a mat-raised-button color="primary" routerLink="/">Create URL</a>
      <a *ngIf="isAuthenticated" mat-stroked-button color="primary" routerLink="/dashboard">Dashboard</a>
    </mat-card-actions>
  </mat-card>
</div>
